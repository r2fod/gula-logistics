name: Keep Render Alive

on:
  schedule:
    # GitHub no garantiza la hora de los programados: con */14 lo ejecutó una vez cada
    # 3–5 h (35 veces del 03/10 al 10/10), así que Render se dormía igual. Esto queda
    # solo de refuerzo (lo despierta si se ha dormido): quien intenta mantenerlo despierto
    # es el propio servidor, que se llama cada 10 min (server/src/services/mantenerDespierto.js).
    - cron: '*/14 * * * *'
    # De 5 a 7 (hora de Madrid) el servidor descansa y, dormido, no puede despertarse
    # solo: estos dos lo despiertan hacia las 06:55 (04:55 UTC en verano, 05:55 UTC en
    # invierno), para que a las 7 ya se esté llamando otra vez. Si GitHub los retrasa,
    # lo despierta la primera persona que entre.
    - cron: '55 4 * * *'
    - cron: '55 5 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente si hace falta

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al servidor de Render
        # /api/health no consulta la base. Hasta 90 s: lo que tarda en despertar. Si
        # falla no se marca en rojo (avisaría por correo cada vez que Render tarde).
        run: curl -sS -o /dev/null --max-time 90 https://gula-logistics.onrender.com/api/health || true
